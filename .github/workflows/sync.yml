name: Sync MDR matches to iCloud (CalDAV)

on:
  schedule:
    # GitHub cron = UTC. Un seul run par jour.
    # 10:00 UTC = midi Europe/Paris en été (CEST). En hiver, ce sera 11:00 Paris.
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      force_run:
        description: "Exécuter la sync immédiatement (optionnel)"
        required: false
        default: "false"
      dry_run:
        description: "DRY RUN (n'écrit pas sur iCloud, mais exécute le scraping)"
        required: false
        default: "false"
      debug_scrape:
        description: "DEBUG scraping (log des endpoints JSON vus)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      ICLOUD_USERNAME: ${{ secrets.ICLOUD_USERNAME }}
      ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
      TEAM_NAME: ${{ secrets.TEAM_NAME }}
      ICLOUD_CALENDAR_NAME: "Matchs Mandatory"
      TZ: Europe/Paris
      FORCE_RUN: ${{ inputs.force_run }}
      DRY_RUN: ${{ inputs.dry_run }}
      DEBUG_SCRAPE: ${{ inputs.debug_scrape }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run sync
        run: npm run start

      - name: Commit updated state (if any)
        run: |
          if git diff --quiet -- data/state.json; then
            echo "No state changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git commit -m "chore(state): update processed matches"
          git push

      - name: Summary
        if: always()
        run: |
          echo "## 📅 Synchronisation MDR → iCloud" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Workflow exécuté le $(date '+%d/%m/%Y à %H:%M:%S %Z')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Consultez les logs ci-dessus pour voir les événements créés/modifiés." >> $GITHUB_STEP_SUMMARY
